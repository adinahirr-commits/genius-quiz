<title>איזור הגאונות שלך — אמא משקיעה</title>
<meta http-equiv="refresh" content="0; url=https://genius.mominvest.co.il/">
<script>
  // תופס לינקים שנשברו (למשל תו כיווניות נסתר שנדבק בהודעת עברית) ומחזיר לשאלון
  (function(){
    var base = "https://genius.mominvest.co.il/";
    var hash = (location.hash || "");
    // מנקה תווי כיווניות נסתרים מה-hash אם נדבקו
    hash = hash.replace(/[‎‏‪-‮⁦-⁩]/g, "");
    location.replace(base + hash);
  })();
</script>
